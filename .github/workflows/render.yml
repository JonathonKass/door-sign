name: Render door sign

on:
  push:
    paths:
      - "schedule.json"
      - "render.py"
      - ".github/workflows/render.yml"
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          pip install --quiet Pillow

      - name: Render the sign
        run: python3 render.py schedule.json sign.png

      - name: Commit the new image
        run: |
          git config user.name "door-sign"
          git config user.email "door-sign@users.noreply.github.com"
          git add sign.png
          if git diff --cached --quiet; then
            echo "Image is unchanged, nothing to commit."
          else
            git commit -m "Update sign for $(date -u +%Y-%m-%d)"
            git push
          fi
