<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Door Sign Preview</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --fg:#1a1a18; --line:#d8d8d2; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16161a; --fg:#ececea; --line:#33333a; }
  }
  body {
    margin:0; padding:24px 16px; background:var(--bg); color:var(--fg);
    font:16px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:18px;
  }
  h1 { font-size:17px; font-weight:600; margin:0; letter-spacing:.01em; }
  figure { margin:0; max-width:832px; width:100%; }
  img {
    width:100%; height:auto; display:block; background:#fff;
    border:1px solid var(--line); border-radius:6px;
    image-rendering:pixelated;
  }
  p { margin:0; font-size:13px; opacity:.65; text-align:center; max-width:60ch; }
  code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
</style>
</head>
<body>
  <h1>Door sign preview</h1>
  <figure>
    <img id="sign" src="sign.png" alt="Current office door sign" width="800" height="480">
  </figure>
  <p>
    This is exactly what the display shows. Edit <code>schedule.json</code> in the
    repository to change it; the image rebuilds within a minute or two.
  </p>
<script>
  // Dodge the CDN cache so a reload always shows the newest render.
  document.getElementById('sign').src = 'sign.png?t=' + Date.now();
</script>
</body>
</html>
